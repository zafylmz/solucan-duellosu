<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>K9K toplama — kesit rehberi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;520;640&family=Source+Serif+4:opsz,wght@8..60,560;8..60,650&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/workshop.css"/>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <strong>K9K 1.5 dCi</strong>
        <span>Kesit çizimiyle toplama sırası</span>
      </div>
      <div class="progress">
        <b id="count">1 / 22</b>
        <div class="track"><i id="bar"></i></div>
      </div>
      <button id="sheet-btn" class="sheet-btn" type="button">Tork cetveli</button>
    </header>
    <div class="board-wrap">
      <section class="board">
        <div class="stage-wrap" id="stage"></div>
        <div class="inset-slot" id="inset"></div>
        <p class="caption">Özgün şema, ölçü çizimi değil. Volan solda, silindir 1 solda. Renault logosu ve fabrika çizimi yoktur. Değerler Teknik Not 6006A ailesi içindir; indeks plakasını doğrula.</p>
      </section>
    </div>
    <aside class="ticket" id="ticket"></aside>
  </div>
  <div class="sheet" id="sheet">
    <article>
      <h2>Tork cetveli</h2>
      <p id="source"></p>
      <table>
        <thead><tr><th>Adım</th><th>Parça</th><th>Sıkma</th><th>Sıra</th></tr></thead>
        <tbody id="sheet-body"></tbody>
      </table>
      <p><button id="sheet-close" type="button">Kapat</button></p>
    </article>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
